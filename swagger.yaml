openapi: 3.0.0
info:
  title: Device API
  version: 1.0.0
  description: API для регистрации и управления датчиками
paths:
  /devices:
    post:
      summary: Регистрация нового устройства
      tags: [Devices]
      parameters:
        - description: авторизационный токен
          in: header
          name: Authorization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
            examples:
              thermostatRegistration:
                summary: Регистрация термостата
                value:
                  serial_number: "TH-001-ABC123"
                  device_type_id: "thermostat-v2"
                  name: "Гостиная термостат"
                  house_id: "house-123e4567-e89b-12d3-a456-426614174000"
                  config:
                    temperature_range: {min: 10, max: 30}
                    supported_modes: ["heat", "cool", "auto"]
      responses:
        '201':
          description: Устройство успешно зарегистрировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Неверные данные устройства
        '500':
          description: Не удалось записать данные

    get:
      summary: Получение списка устройств пользователя
      tags: [Devices]
      parameters:
        - description: авторизационный токен
          in: header
          name: Authorization
          required: true
          schema:
            type: string
        - name: house_id
          in: query
          schema:
            type: string
            format: uuid
          description: Фильтр по дому
        - name: device_type
          in: query
          schema:
            type: string
          description: Фильтр по типу устройства
      responses:
        '200':
          description: Список устройств
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceResponse'
        '500':
          description: Не удалось получить информацию

  /devices/{device_id}:
    get:
      summary: Получение информации об устройстве
      tags: [Devices]
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - description: авторизационный токен
          in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Информация об устройстве
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '404':
          description: Устройство не найдено
        '403':
          description: Нет прав для получения информации о датчике
        '500':
          description: Не удалось записать конфигурацию для устройства

    patch:
      summary: Обновление конфигурации устройства
      tags: [Devices]
      security:
        - BearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - description: авторизационный токен
          in: header
          name: Authorization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: Конфигурация обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '403':
          description: Нет прав для управления устройством
        '500':
          description: Не удалось записать конфигурацию для устройства

  /devices/{device_id}/commands:
    post:
      summary: Отправка команды устройству
      tags: [Devices]
      security:
        - BearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - description: авторизационный токен
          in: header
          name: Authorization
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCommand'
      responses:
        '202':
          description: Команда принята к исполнению
          content:
            application/json:
              schema:
                type: object
                properties:
                  command_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [pending, delivered, executed, failed]
        '404':
          description: Устройство не найдено
        '403':
          description: Нет прав для управления устройством
        '500':
          description: Не удалось записать команду для устройства

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterDeviceRequest:
      type: object
      required:
        - serial_number
        - device_type_id
        - house_id
      properties:
        serial_number:
          type: string
          example: "TH-001-ABC123"
        device_type_id:
          type: string
          example: "thermostat-v2"
        name:
          type: string
          example: "Гостиная термостат"
        house_id:
          type: string
          format: uuid
        config:
          type: object
          additionalProperties: true

    DeviceResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        serial_number:
          type: string
        name:
          type: string
        device_type:
          type: string
        status:
          type: string
          enum: [online, offline, error, updating]
        house_id:
          type: string
          format: uuid
        config:
          type: object
        last_seen:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    UpdateDeviceRequest:
      type: object
      properties:
        name:
          type: string
        config:
          type: object

    DeviceCommand:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [turn_on, turn_off, set_temperature, set_brightness, lock, unlock]
        parameters:
          type: object
          properties:
            temperature:
              type: number
            brightness:
              type: integer
              minimum: 0
              maximum: 100
            duration:
              type: integer